[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aosu-ha"
version = "0.1.0"
description = "Unofficial Python client, AWS IoT MQTT listener, and Home Assistant bridge for Aosu cameras"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "paho-mqtt>=2.0.0",
]

[project.scripts]
aosu-cli = "aosu.cli:main"

[tool.setuptools.packages.find]
include = ["aosu*"]
